server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          # URI pública do servidor de identidade (Keycloak/Auth0/Mock) que fornece a chave pública
          # Nota: em ambiente local sem Auth Server real, você precisará usar uma chave secreta estática ou mock.
          jwk-set-uri: http://keycloak:8080/realms/master/protocol/openid-connect/certs

  cloud:
    gateway:
      routes:
        # Rota 1: Account Service (Tem Rate Limiter e Guardrail)
        - id: account-service-route
          uri: http://bank-account-service:8081
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - AccountStatusGuardrail
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # Rota 2: Onboarding Service
        - id: onboarding-service-route
          uri: http://bank-onboarding-service:8082
          predicates:
            - Path=/api/v1/onboarding/**

        # Rota 3: Hub IA Service (Chat)
        - id: hub-ia-service-route
          uri: http://bank-hub-ia:8084
          predicates:
            - Path=/api/v1/chat/**

        - id: transaction-service-route
          uri: http://bank-transaction-service:8085
          predicates:
            - Path=/api/v1/transactions/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics