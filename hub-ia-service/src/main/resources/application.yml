server:
  port: 8084

spring:
  application:
    name: hub-ia-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://keycloak:8080/realms/bankhub/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/bankhub}

bankhub:
  services:
    account:
      url: ${BANKHUB_SERVICES_ACCOUNT_URL:http://localhost:8081}

langchain4j:
  open-ai:
    chat-model:
      base-url: ${LANGCHAIN4J_OPEN_AI_CHAT_MODEL_BASE_URL:http://localhost:4000/v1}
      api-key: ${LANGCHAIN4J_OPEN_AI_CHAT_MODEL_API_KEY:mock-key}
      model-name: ollama/gemma2
      temperature: 0.2
      max-tokens: 500

resilience4j:
  circuitbreaker:
    instances:
      accountServiceCB:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics