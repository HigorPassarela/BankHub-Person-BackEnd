version: '3.8'

networks:
  bank-network:
    name: bank-network
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  es_data:
  litellm_db_data:
  keycloak_data:

services:
  mongodb:
    image: mongo:7.0
    container_name: bank-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db
    networks:
      - bank-network

  redis:
    image: redis:7.2-alpine
    container_name: bank-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bank-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: bank-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_data:/var/lib/zookeeper/log
    networks:
      - bank-network

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: bank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - bank-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: bank-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - bank-network

  zeebe:
    image: camunda/zeebe:8.4.0
    container_name: bank-zeebe
    ports:
      - "26500:26500"
      - "9600:9600"
    environment:
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - bank-network

  operate:
    image: camunda/operate:8.4.0
    container_name: bank-operate
    ports:
      - "8081:8080"
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - zeebe
      - elasticsearch
    networks:
      - bank-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: bank-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - bank-network

  postfix:
    image: boky/postfix:v3.8.0
    container_name: bank-postfix
    environment:
      - ALLOW_EMPTY_SENDER_DOMAINS=true
      - ALLOWED_SENDER_DOMAINS=${POSTFIX_ALLOWED_DOMAINS:-bankhub.local}
      - RELAYHOST=${POSTFIX_RELAYHOST:-}
      - RELAYHOST_USERNAME=${POSTFIX_RELAYHOST_USERNAME:-}
      - RELAYHOST_PASSWORD=${POSTFIX_RELAYHOST_PASSWORD:-}
    ports:
      - "1587:587"
    networks:
      - bank-network
    profiles:
      - production

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: bank-litellm
    ports:
      - "4000:4000"
    environment:
      - UI_USERNAME=admin
      - UI_PASSWORD=sk-1234
      - STORE_MODEL_IN_DB=True
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command:
      - "--config=/app/config.yaml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - litellm-db
    networks:
      - bank-network

  litellm-db:
    image: postgres:15-alpine
    container_name: bank-litellm-db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm_senha
      POSTGRES_DB: litellm
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    networks:
      - bank-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.4
    container_name: bank-keycloak
    ports:
      - "9000:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/bankhub-realm.json:/opt/keycloak/data/import/bankhub-realm.json:ro
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bank-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: bank-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics
      - "13133:13133" # Health check
    networks:
      - bank-network

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: bank-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC collector
      - "14268:14268" # HTTP collector
    networks:
      - bank-network