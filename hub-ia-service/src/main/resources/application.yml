server:
  port: 8084

spring:
  application:
    name: hub-ia-service

  data:
    redis:
      host: localhost
      port: 6379

bankhub:
  services:
    account:
      url: http://localhost:8081

langchain4j:
  open-ai:
    chat-model:
      base-url: http://localhost:4000/v1 # Roteia a API "Fake OpenAI" para o LiteLLM
      api-key: mock-key-local # Obrigatório pelo starter, mas ignorado pelo LiteLLM
      model-name: ollama/gemma2
      temperature: 0.2 # Baixa temperatura para a IA ser mais séria e analítica (Contexto Bancário)
      max-tokens: 500  # Evita que o LLM gaste muito processamento local gerando textos gigantescos

resilience4j:
  circuitbreaker:
    instances:
      accountServiceCB:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics