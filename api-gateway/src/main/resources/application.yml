server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          # URI pública do servidor de identidade (Keycloak/Auth0/Mock) que fornece a chave pública
          # Nota: em ambiente local sem Auth Server real, você precisará usar uma chave secreta estática ou mock.
          jwk-set-uri: http://localhost:9000/oauth2/jwks

  cloud:
    gateway:
      routes:
        - id: account-service-route
          uri: http://localhost:8081 # Redireciona para o Account Service
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            # Ativa o Guardrail que criamos para essa rota específica
            - AccountStatusGuardrail
            # Ativa o Rate Limiter baseado em Redis
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics